<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filamen Karat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    :root {
      --bg-light: #fefefe;
      --bg-dark: #1c1c1c;
      --text-light: #333;
      --text-dark: #f9f9f9;

      --primary-light: #a5d8ff;
      --primary-dark: #74c0fc;

      --accent-light: #ffd6e0;
      --accent-dark: #ff6b81;

      --card-bg-light: #ffffff;
      --card-bg-dark: #2b2b2b;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: all 0.4s ease;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    header {
      text-align: center;
      background: var(--primary-light);
      padding: 2.5rem 1rem;
      transition: background 0.4s ease;
    }

    body.dark header {
      background: var(--primary-dark);
    }

    .profile-image img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .greeting-card, .bio {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1.5rem 2rem;
      background-color: var(--card-bg-light);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      transition: background 0.4s ease;
    }

    body.dark .greeting-card,
    body.dark .bio {
      background-color: var(--card-bg-dark);
    }

    .greeting-card {
      animation: slideFade 1.2s ease-in-out;
      text-align: center;
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .social-links {
      text-align: center;
      margin: 2rem 0;
    }

    .social-links a {
      color: inherit;
      font-size: 1.6rem;
      margin: 0 0.7rem;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .social-links a:hover {
      transform: scale(1.2);
      color: var(--accent-dark);
    }

    /* Theme toggle button */
    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 2px solid var(--text-light);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-light);
      transition: all 0.4s ease;
    }

    body.dark .theme-toggle {
      border-color: var(--text-dark);
      color: var(--text-dark);
    }

    @media (max-width: 600px) {
      .profile-image img {
        width: 110px;
        height: 110px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

  <header>
    <div class="profile-image">
      <img src="DSC_0278.JPG" alt="Your Profile Photo">
    </div>
    <h1>Aniq Ayadi</h1>
    <p>Welcome to Filamen Karat page!</p>
  </header>

  <section class="greeting-card">
    ✨ Hello! Im nico. Here is just my profile. Nothing much.
  </section>

  <section class="bio">
    <p>Im nico,love coding, love arts, love travelling and adventurous. All the buttons is not yet config. later la i do.</p>
  </section>

  <div class="social-links">
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-linkedin"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
